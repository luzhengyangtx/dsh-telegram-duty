name: ✨ 功能建议 / Feature Request
description: 提出新功能或改进想法
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议！请先搜索已有 issue 避免重复；免费/专业版划分见 README 的 Roadmap。
  - type: textarea
    id: idea
    attributes:
      label: 你的想法
      description: 想要什么功能？解决什么场景？
    validations:
      required: true
  - type: textarea
    id: usage
    attributes:
      label: 使用场景
      description: 你会在什么情况下用到它？
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 有没有别的办法能部分满足这个需求？
